services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lustre-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lustre-backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

    env_file:
      - ./backend/.env

    restart: unless-stopped