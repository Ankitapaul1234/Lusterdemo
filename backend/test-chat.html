<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Lustre Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #response {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>💬 Lustre Support Test</h1>

    <input
        type="text"
        id="message"
        placeholder="Type your message..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <div id="response">
        Response will appear here...
    </div>

    <script>
        async function sendMessage() {

            const messageInput = document.getElementById("message");
            const responseBox = document.getElementById("response");

            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            responseBox.textContent = "Lustre Support is typing...";

            try {

                const response = await fetch(
                    "https://luster-ainailstudio.onrender.com/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: message,
                            history: []
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    responseBox.textContent = data.reply;

                } else {

                    responseBox.textContent =
                        data.message || "Something went wrong.";

                }

            } catch (error) {

                console.error(error);

                responseBox.textContent =
                    "Could not connect to the backend.";
            }
        }
    </script>

</body>
</html>
